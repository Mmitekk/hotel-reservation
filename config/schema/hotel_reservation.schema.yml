hotel_reservation.settings:
  type: config_object
  label: 'Hotel Reservation Settings'
  mapping:
    hotel_name:
      type: string
      label: 'Hotel name'
    currency_symbol:
      type: string
      label: 'Currency symbol'
    currency_code:
      type: string
      label: 'Currency code'
    min_stay_nights:
      type: integer
      label: 'Minimum stay nights'
    max_stay_nights:
      type: integer
      label: 'Maximum stay nights'
    check_in_time:
      type: string
      label: 'Check-in time'
    check_out_time:
      type: string
      label: 'Check-out time'
    booking_conditions:
      type: text
      label: 'Booking conditions text'
    reservation_expiration_hours:
      type: integer
      label: 'Reservation expiration hours'
    admin_notification_email:
      type: email
      label: 'Admin notification email'
    enable_admin_notification:
      type: boolean
      label: 'Enable admin notifications'
    enable_guest_confirmation:
      type: boolean
      label: 'Enable guest confirmation emails'
    # Booking form design settings.
    form_title:
      type: string
      label: 'Booking form title'
    form_subtitle:
      type: string
      label: 'Booking form subtitle'
    form_button_text:
      type: string
      label: 'Booking button text'
    form_primary_color:
      type: string
      label: 'Primary color (hex)'
    form_background_color:
      type: string
      label: 'Background color (hex)'
    form_text_color:
      type: string
      label: 'Text color (hex)'
    form_border_radius:
      type: integer
      label: 'Border radius (px)'
    form_success_title:
      type: string
      label: 'Success message title'
    form_success_text:
      type: string
      label: 'Success message text'
    share_enabled:
      type: boolean
      label: 'Share enabled'
    share_token:
      type: string
      label: 'Share token'
    share_password:
      type: string
      label: 'Share password'
    room_modal_width:
      type: integer
      label: 'Room modal width (%)'

hr_room_type.*:
  type: config_entity
  label: 'Room type'
  mapping:
    id:
      type: string
      label: 'Machine name'
    label:
      type: label
      label: 'Label'
    color:
      type: string
      label: 'Color'
    weight:
      type: integer
      label: 'Weight'
    uuid:
      type: string

hr_room.*:
  type: config_entity
  label: 'Room'
  mapping:
    id:
      type: integer
      label: 'ID'
    name:
      type: label
      label: 'Room name'
    teaser:
      type: text
      label: 'Teaser'
    description:
      type: text
      label: 'Description'
    capacity:
      type: integer
      label: 'Capacity'
    base_price:
      type: string
      label: 'Base price'
    amenities:
      type: string
      label: 'Amenities'
    status:
      type: boolean
      label: 'Published'
    sort_weight:
      type: integer
      label: 'Sort weight'

hr_reservation.*:
  type: config_entity
  label: 'Reservation'
  mapping:
    id:
      type: integer
      label: 'ID'
    room_id:
      type: integer
      label: 'Room ID'
    check_in:
      type: string
      label: 'Check-in date'
    check_out:
      type: string
      label: 'Check-out date'
    guest_name:
      type: string
      label: 'Guest name'
    guest_phone:
      type: string
      label: 'Guest phone'
    guest_email:
      type: email
      label: 'Guest email'
    guest_count:
      type: integer
      label: 'Guest count'
    status:
      type: string
      label: 'Status'
    total_price:
      type: string
      label: 'Total price'
    notes:
      type: text
      label: 'Guest notes'
    admin_notes:
      type: text
      label: 'Admin notes'
