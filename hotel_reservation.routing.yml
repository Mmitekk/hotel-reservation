hotel_reservation.dashboard:
  path: '/admin/hotel-reservation/dashboard'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\DashboardController::dashboard'
    _title: 'Dashboard'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.settings:
  path: '/admin/config/hotel-reservation/settings'
  defaults:
    _form: '\Drupal\hotel_reservation\Form\SettingsForm'
    _title: 'Hotel Reservation Settings'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.rooms_list:
  path: '/admin/hotel-reservation/rooms'
  defaults:
    _entity_list: 'hr_room'
    _title: 'Rooms'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_add:
  path: '/admin/hotel-reservation/rooms/add'
  defaults:
    _entity_form: 'hr_room.default'
    _title: 'Add Room'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_edit:
  path: '/admin/hotel-reservation/rooms/{hr_room}/edit'
  defaults:
    _entity_form: 'hr_room.default'
    _title: 'Edit Room'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_delete:
  path: '/admin/hotel-reservation/rooms/{hr_room}/delete'
  defaults:
    _entity_form: 'hr_room.delete'
    _title: 'Delete Room'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_pricing:
  path: '/admin/hotel-reservation/rooms/{hr_room}/pricing/{month}/{year}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::roomPricing'
    _title: 'Room Pricing Calendar'
    month: NULL
    year: NULL
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_pricing_save:
  path: '/admin/hotel-reservation/rooms/{hr_room}/pricing/save'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::roomPricingSave'
    _title: 'Save Room Pricing'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservations_list:
  path: '/admin/hotel-reservation/reservations'
  defaults:
    _entity_list: 'hr_reservation'
    _title: 'Reservations'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservation_view:
  path: '/admin/hotel-reservation/reservations/{hr_reservation}'
  defaults:
    _entity_view: 'hr_reservation'
    _title: 'Reservation Details'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservation_edit:
  path: '/admin/hotel-reservation/reservations/{hr_reservation}/edit'
  defaults:
    _entity_form: 'hr_reservation.default'
    _title: 'Edit Reservation'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservation_delete:
  path: '/admin/hotel-reservation/reservations/{hr_reservation}/delete'
  defaults:
    _entity_form: 'hr_reservation.delete'
    _title: 'Delete Reservation'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservation_status:
  path: '/admin/hotel-reservation/reservations/{hr_reservation}/status/{status}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::changeReservationStatus'
    _title: 'Change Reservation Status'
  requirements:
    _permission: 'administer hotel reservation'
    _csrf_token: 'TRUE'

hotel_reservation.calendar:
  path: '/admin/hotel-reservation/calendar/{month}/{year}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::calendar'
    _title: 'Reservation Calendar'
    month: NULL
    year: NULL
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.export_csv:
  path: '/admin/hotel-reservation/reservations/export'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\DashboardController::exportCsv'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.api_check_availability:
  path: '/api/hotel-reservation/check-availability'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::checkAvailability'
  requirements:
    _permission: 'access content'
    _format: json

hotel_reservation.api_submit_reservation:
  path: '/api/hotel-reservation/submit'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::submitReservation'
  requirements:
    _permission: 'access content'
    _csrf_token: 'TRUE'
    _format: json

hotel_reservation.api_room_prices:
  path: '/api/hotel-reservation/room-prices/{room_id}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::getRoomPrices'
  requirements:
    _permission: 'access content'
    _format: json
