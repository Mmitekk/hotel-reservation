# Hotel Reservation module — custom routes only.
# Entity CRUD routes (collection, add-form, edit-form, delete-form, canonical)
# are auto-generated from entity annotations by AdminHtmlRouteProvider.
# Do NOT duplicate them here.

hotel_reservation.dashboard:
  path: '/admin/hotel-reservation/dashboard'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\DashboardController::dashboard'
    _title: 'Панель управления'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.analytics:
  path: '/admin/hotel-reservation/analytics'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\AnalyticsController::analytics'
    _title: 'Аналитика бронирований'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.settings:
  path: '/admin/config/hotel-reservation/settings'
  defaults:
    _form: '\Drupal\hotel_reservation\Form\SettingsForm'
    _title: 'Настройки бронирования'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_pricing:
  path: '/admin/hotel-reservation/rooms/{hr_room}/pricing/{month}/{year}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::roomPricing'
    _title: 'Календарь цен номера'
    month: NULL
    year: NULL
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.room_pricing_save:
  path: '/admin/hotel-reservation/rooms/{hr_room}/pricing/save'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::roomPricingSave'
    _title: 'Сохранение цен'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.reservation_status:
  path: '/admin/hotel-reservation/reservations/{hr_reservation}/status/{status}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::changeReservationStatus'
    _title: 'Изменение статуса бронирования'
  requirements:
    _permission: 'administer hotel reservation'
    _csrf_token: 'TRUE'

hotel_reservation.calendar:
  path: '/admin/hotel-reservation/calendar/{month}/{year}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\HotelReservationController::calendar'
    _title: 'Календарь бронирований'
    month: NULL
    year: NULL
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.export_csv:
  path: '/admin/hotel-reservation/reservations/export'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\DashboardController::exportCsv'
  requirements:
    _permission: 'administer hotel reservation'

hotel_reservation.api_check_availability:
  path: '/api/hotel-reservation/check-availability'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::checkAvailability'
  requirements:
    _permission: 'access content'
    _format: json

hotel_reservation.api_submit_reservation:
  path: '/api/hotel-reservation/submit'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::submitReservation'
  requirements:
    _permission: 'access content'
    _format: json

hotel_reservation.api_room_prices:
  path: '/api/hotel-reservation/room-prices/{room_id}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::getRoomPrices'
  requirements:
    _permission: 'access content'
    _format: json

hotel_reservation.api_room:
  path: '/api/hotel-reservation/room/{room_id}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\ApiController::getRoom'
  requirements:
    _permission: 'access content'
    _format: json

hotel_reservation.share_dashboard:
  path: '/hotel-reservation/share/{token}/dashboard'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\SharedController::dashboard'
    _title: 'Панель — доступ для клиента'
  requirements:
    _permission: 'access content'
    token: '[a-zA-Z0-9_-]+'

hotel_reservation.share_analytics:
  path: '/hotel-reservation/share/{token}/analytics'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\SharedController::analytics'
    _title: 'Аналитика — доступ для клиента'
  requirements:
    _permission: 'access content'
    token: '[a-zA-Z0-9_-]+'

hotel_reservation.share_calendar:
  path: '/hotel-reservation/share/{token}/calendar'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\SharedController::calendar'
    _title: 'Календарь — доступ для клиента'
  requirements:
    _permission: 'access content'
    token: '[a-zA-Z0-9_-]+'

hotel_reservation.share_calendar_month:
  path: '/hotel-reservation/share/{token}/calendar/{month}/{year}'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\SharedController::calendar'
    _title: 'Календарь — доступ для клиента'
  requirements:
    _permission: 'access content'
    token: '[a-zA-Z0-9_-]+'
    month: '\d+'
    year: '\d+'

hotel_reservation.share_info:
  path: '/admin/hotel-reservation/share'
  defaults:
    _controller: '\Drupal\hotel_reservation\Controller\SharedController::shareInfo'
    _title: 'Открытые страницы'
  requirements:
    _permission: 'administer hotel reservation'
